<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>portfolio</title>
        <!-- Bootstrap CSS v5.2.1 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="portfolio.css">
    </head>

    <body>

        <header>  
            <ul id="my-navigation" class="my-navigation">
                <li id="Accueil" class="my-nav"><a href="index.html">Accueil</a></li>
                <!--éléments alignés à droite la balise "li" sert à ce que le code soit alider par le W3C en évitant une balise div-->
                <li>
                    <ul class="my-nav-right">
                        <li id="Menu-CV" class="my-nav"><a href="cv.html">CV</a></li>
                        <li id="Menu-competence" class="my-nav"><a href="index.html">Compétences</a></li>
                        <li id="Menu-Contact" class="my-nav"><a href="#contact-form">Contact</a></li>
                    </ul>
                </li>
            </ul>

            <h1 id="titre_principale"> Mathis COMMERGNAT </h1> 
        </header>

        <main>
            <embed  id="CV-pdf-affichage" src="Galerie/cv-mathis-commergnat.pdf" type="application/pdf">
            
            <div id="Bouton-page-CV">
                <a id="Bouton-page-CV-pdf"
                    class="btn btn-primary"
                    href="Galerie/cv-mathis-commergnat.pdf"
                    role="button"
                    target="_blank"> PDF
                </a>
            </div>
        </main>

        <footer> 

            <form id="contact-form">

                <h2> Me contacter </h2>

                <div class="form-group">
                    <label for="name">Nom:</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Votre Nom" required>
                    <span id="errorname" class="text-danger"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Votre Email" required>
                    <span id="erroremail" class="text-danger"></span>
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" class="form-control" placeholder="Votre Message" required></textarea>
                    <span id="errormsg" class="text-danger"></span>
                </div>

                <button type="submit" class="btn btn-primary">Envoyer</button>

            </form>

            <hr class="separateur">

            <div id="mes-liens">
                <label id="mes-liens-titre">Mes liens</label>
                <a id="linkedin" href="https://www.linkedin.com/in/mathis-commergnat-4a0222296/">
                    <img id="image-linkedin" src="Galerie/Icones/icone-linkedin.png" alt="LinkedIn">
                </a>

                <a id="Github" href="https://github.com/mnopsice?tab=repositories">
                    <img id="image-Github" src="Galerie/Icones/icone-github.png" alt="GitHub">
                </a>
            </div>

        </footer>


    <script src="portfolio.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
